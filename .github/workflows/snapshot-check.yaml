name: Current development snapshot check
on:
  push:
    branches: [work/current-0.0.47.9000]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapshot-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  R-CMD-check:
    runs-on: macos-15-arm64
    timeout-minutes: 45
    env:
      R_CHECK_NUM_THREADS: 1
      _R_CHECK_NCPU_: 1
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      MAKEFLAGS: -j1
      _R_CHECK_FORCE_SUGGESTS_: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          packages: |
            deps::.
            any::rcmdcheck
            any::posterior@1.7.0
            any::lavaan@0.7-2
            stan-dev/cmdstanr@da99e2ba954658bdad63bffb738c4444c33a4e0e
          dependencies: '"all"'
          install-quarto: false
          install-pandoc: false
      - name: Check all package tests with native construction guards
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          args: '"--no-manual"'
          error-on: '"warning"'
          upload-results: never
      - name: Report exact SHA, executed files and optional skips
        if: always()
        shell: python
        run: |
          import glob, os, pathlib, re
          files = glob.glob('check/**/tests/*.Rout*', recursive=True)
          lines = [f"Checked commit: {os.environ['GITHUB_SHA']}",
                   f"Test output files produced: {len(files)} / 104 expected"]
          for name in sorted(files):
              for line in pathlib.Path(name).read_text(errors='replace').splitlines():
                  if re.match(r'^(SKIP|CmdStanR unavailable)', line):
                      lines.append(f"{pathlib.Path(name).name}: {line}")
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Engineering test coverage\n\n' + text)
          if not files:
              print('No package test results: setup or check did not complete.')
