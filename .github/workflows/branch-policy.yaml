name: Branch policy
on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  branch-policy:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Enforce PR route from trusted base workflow
        shell: python
        run: |
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH']) as f:
              pr = json.load(f)['pull_request']
          base, head = pr['base'], pr['head']
          same_repo = head['repo'] and head['repo']['full_name'] == base['repo']['full_name']
          if base['ref'] == 'main':
              assert same_repo and head['ref'] == 'develop', 'main accepts only same-repository develop PRs'
          else:
              assert head['ref'] not in ('main', 'develop'), 'develop accepts feature/fix branches'
          print('PR route accepted:', head['ref'], '->', base['ref'])
